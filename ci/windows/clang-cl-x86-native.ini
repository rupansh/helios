# x86 executables run natively under WoW64 on the AMD64 builder. Import the
# x86 Visual Studio environment before using this file so LIB selects x86.
# Pin the compiler target: an AMD64 clang-cl executable otherwise defaults x64.
[binaries]
c = ['clang-cl', '--target=i686-pc-windows-msvc']
cpp = ['clang-cl', '--target=i686-pc-windows-msvc']
c_ld = 'lld-link'
cpp_ld = 'lld-link'
windres = 'rc'
rc = 'rc'
