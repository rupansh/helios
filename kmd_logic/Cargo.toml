[package]
name = "helios_kmd_logic"
version = "0.1.0"
edition = "2021"
description = "Host-testable no_std leaf logic shared with the Helios WDDM miniport. Deliberately dependency-free: no wdk-sys, no bindgen, no build.rs, so `cargo test` runs on the Linux host."

[lib]
# Pure argument-only functions: usable from the no_std kernel-mode KMD and from a
# host libtest harness. `kmd_render` itself cannot host tests (build.rs runs
# bindgen over ntddk.h/dispmprt.h/d3dkmddi.h and shells to rc.exe; the crate is a
# `panic = "abort"` cdylib), which is why this logic lives out-of-crate.
crate-type = ["lib"]

[dependencies]
# ⚠ The invariant this list protects is NOT "no dependencies". It is: nothing
# reachable from here may read kernel state. Concretely, and this is the whole
# rule — no `wdk-sys`, no `wdk-build`, no generated `dxgk`/`ntddk` bindings, and
# no `kmd_render` types (`AdapterContext`, `DeviceContext`, any HANDLE). With
# that edge absent, every function in this crate is a function of its arguments
# and nothing else, which is exactly the property that makes it runnable under
# a host libtest harness.
#
# `helios_protocol` satisfies that invariant and is admitted (K4, 2026-08-10).
# It is `#![no_std]`, it is already a `kmd_render` dependency, and it declares
# wire records — HWA2/HVM1/HOC1 — that carry no handle, no pointer and no
# kernel state by construction (§10.3: "no host resource token, resid, PID,
# process handle, synchronization object, mutable value, or independently
# usable identity"). The alternative was worse and there is prior art for how
# much worse: the old native-fence lifecycle code re-declared the whole HNF1
# offset table locally because this edge was absent. HNF1 now follows the same
# rule as HWA2/HVM1/HOC1 and consumes protocol's record and validators directly.
#
# The edge does pull `bytemuck` into the graph transitively. That is not a
# regression of the rule above: `bytemuck` is not re-exported by
# `helios_protocol` (`protocol/src/lib.rs:81-91` re-exports only the record
# modules), so it is not nameable from this crate, and it reads nothing but the
# bytes it is handed.
helios_protocol = { path = "../protocol" }
