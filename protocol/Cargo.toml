[package]
authors = ["WinBoat"]
name = "helios_protocol"
version = "0.1.0"
edition = "2021"
description = "Shared no_std wire-format definitions for the Helios vGPU ICD <-> KMD <-> virtio-gpu path. Single source of truth so the ICD and KMD can never drift on struct layout."

[lib]
# Pure definitions: usable from the no_std KMD, the std ICD, and the host tool.
crate-type = ["lib"]

[dependencies]
# bytemuck is no_std by default; `derive` works without std.
bytemuck = { version = "1", features = ["derive"] }

[target.'cfg(target_os = "linux")'.dev-dependencies]
# Authoritative virtio-gpu constants (generated from the Linux uapi headers).
# These bindings encode the Linux C ABI and cannot compile for Windows; keep
# their comparison tests on Linux. Helios wire assertions/tests run on both.
# Dev-dep only: the crate is std (bindgen `::std::os::raw`), so it cannot go in
# the no_std build — instead the `virtio_gpu::tests` module pins our hand-defined
# wire constants to it, so `cargo test` fails if they ever drift.
virtio-bindings = "0.2.7"
