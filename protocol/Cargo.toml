[package]
name = "helios_protocol"
version = "0.1.0"
edition = "2021"
description = "Shared no_std wire-format definitions for the Helios vGPU UMD/ICD <-> KMD <-> virtio-gpu/QEMU path: HWA2/HOB1/HOS1/HOC1, HQA1/HTS1, HVC1/HNR2/HVM1/HVR1, HPM1, and the ETW schema. Single source of truth (including the atomic package generation) so no two halves of a boundary can drift on struct layout."

[lib]
# Pure definitions: usable from the no_std KMD, the std UMDs/ICD, and host tools.
# Layout is pinned by `const` assertions, so a wrong offset breaks the build.
crate-type = ["lib"]

[dependencies]
# bytemuck is no_std by default; `derive` works without std.
bytemuck = { version = "1", features = ["derive"] }

[dev-dependencies]
# Authoritative virtio-gpu constants (generated from the Linux uapi headers).
# Dev-dep only: the crate is std (bindgen `::std::os::raw`), so it cannot go in
# the no_std build — instead the `virtio_gpu::tests` module pins our hand-defined
# wire constants to it, so `cargo test` fails if they ever drift.
virtio-bindings = "0.2.7"
