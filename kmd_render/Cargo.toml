[package]
name = "helios_kmd_render"
version = "0.1.0"
edition = "2021"
build = "build.rs"
description = "Helios vGPU WDDM 3.2 render-only miniport bring-up driver."

[lib]
crate-type = ["cdylib"]

# windows-drivers-rs driver model. WDM = we register the DDI table ourselves
# (via DxgkInitialize) rather than going through KMDF.
[package.metadata.wdk.driver-model]
driver-type = "WDM"

[dependencies]
# windows-drivers-rs family — coherent set published 2025-11-14.
wdk = "0.4"
wdk-sys = "0.5"
wdk-alloc = "0.4"
wdk-panic = "0.4"
# Shared wire-format definitions (no_std), so virtio-gpu structs match the ICD.
helios_protocol = { path = "../protocol" }
# Host-testable no_std leaf logic (page/pitch arithmetic). Deliberately has no
# wdk-sys/bindgen edge so `cargo test` can run against it on the Linux host —
# this crate cannot host a libtest harness itself (build.rs bindgen + rc.exe,
# `panic = "abort"` cdylib).
helios_kmd_logic = { path = "../kmd_logic" }
# no_std; used to serialize helios_protocol command structs (Pod) into the DMA
# scratch buffers. default-features=false keeps it std-free for the kernel target.
bytemuck = { version = "1", default-features = false, features = ["derive"] }
# Maintained no_std virtio transport. We implement its Hal + ConfigurationAccess
# over WDK primitives (see virtio/hal.rs, virtio/config.rs) and drive a raw
# VirtQueue with helios_protocol commands, skipping its built-in 2D GPU driver.
# The KMD uses only direct descriptor chains (`VirtQueue::new(..., false,
# false)`). Disabling the crate's default `alloc`/`embedded-io` features removes
# its unused 64-entry indirect-descriptor pointer table from every control-queue
# value and constructor return slot. Besides shrinking the hot queue object,
# this is a kernel boot-stack requirement: StartDevice nests `VirtioGpu::init`
# and `VirtQueue::new`, so each unused inline table is paid again on that path.
# D4 also audits `VirtQueue::add` as part of its device-DIRQL call graph. Pin the
# exact reviewed source and keep `alloc` disabled so that operation can only use
# the crate's fixed direct-descriptor path.
virtio-drivers = { version = "=0.13.0", default-features = false }

[build-dependencies]
wdk-build = "0.5"
# Compiles src/seh_shim.c — a C __try/__except wrapper for
# MmMapLockedPagesSpecifyCache(UserMode), which RAISES on failure (no SEH in
# no_std Rust → bugcheck, reachable from any process via Escape MAP_BLOB).
cc = "1"
# We generate the WDDM display-miniport DDIs ourselves: wdk-sys has no display
# ApiSubset, so build.rs runs bindgen over dispmprt.h + d3dkmddi.h. See build.rs.
# MUST match the bindgen version wdk-build uses, so its BuilderExt
# (Builder::wdk_default) applies to the same bindgen::Builder type we construct.
# That is now 0.72.1, pinned by the [patch.crates-io] below — see it for why.
bindgen = "0.72"

# ⛔ WHY THE WHOLE windows-drivers-rs FAMILY IS PATCHED TO GIT (2026-08-10)
#
# `wdk-sys` 0.5.1 as PUBLISHED pins `bindgen = "0.71.1"`, and bindgen 0.71 +
# libclang 22 mis-binds any struct that is forward-declared before it is
# defined: it emits the opaque `pub _address: u8` (size 1) for the type AND a
# layout assertion computed from the real definition. The two disagree, so every
# such assertion underflows and the crate does not compile:
#
#   types.rs:302  error[E0080]: attempt to compute `1_usize - 352_usize`
#   ... 40 of them, 39 opaque types, all CRT/Windows structs, none of them ours.
#
# This is not a Helios defect and not a WDK defect. It was proven by building a
# scratch crate whose only dependency is `wdk-sys = "0.5.1"` and which contains
# no Helios code at all: it fails identically. The breakage had been latent
# since the LLVM 22 upgrade and was masked by a cached 2026-08-08 `types.rs`; the
# first change that invalidated that fingerprint regenerated it and exposed it.
# ⚠ Downgrading is NOT the fix and was measured not to be: forcing MSVC 14.44
# (`VCToolsInstallDir`) regenerates the identical 39 opaque types. The toolchain
# is the newer one deliberately, so the bindgen has to catch up to it.
#
# Upstream already fixed it — `windows-drivers-rs` main moved the workspace to
# `bindgen = "0.72.1"` — but has not published a release since, so crates.io
# still serves 0.5.1/0.4.1 with the 0.71 pin. Every crate's version in the graph
# is IDENTICAL upstream (wdk-build/wdk-sys/wdk-macros 0.5.1, wdk/wdk-alloc/
# wdk-panic 0.4.1), so the patch applies without changing a single requirement.
#
# ⭐ Pinned to an exact rev, never a branch: `[patch]` against a moving branch
# would silently re-resolve the kernel's entire binding surface on someone
# else's schedule. Revisit when a release ships with bindgen >= 0.72, and delete
# this block rather than repointing it.
[patch.crates-io]
wdk = { git = "https://github.com/microsoft/windows-drivers-rs", rev = "6b040c03e56fbbebc10ed86136839774a82c3b59" }
wdk-sys = { git = "https://github.com/microsoft/windows-drivers-rs", rev = "6b040c03e56fbbebc10ed86136839774a82c3b59" }
wdk-alloc = { git = "https://github.com/microsoft/windows-drivers-rs", rev = "6b040c03e56fbbebc10ed86136839774a82c3b59" }
wdk-panic = { git = "https://github.com/microsoft/windows-drivers-rs", rev = "6b040c03e56fbbebc10ed86136839774a82c3b59" }
wdk-build = { git = "https://github.com/microsoft/windows-drivers-rs", rev = "6b040c03e56fbbebc10ed86136839774a82c3b59" }
wdk-macros = { git = "https://github.com/microsoft/windows-drivers-rs", rev = "6b040c03e56fbbebc10ed86136839774a82c3b59" }

[profile.dev]
panic = "abort"
lto = "thin"
opt-level = 1

[profile.release]
panic = "abort"
lto = true
opt-level = 3
codegen-units = 1

[features]
default = []
